<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settly — Furnish your first place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geist: free stand-in for Dinamo's ABC Diatype -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111316; --ink2:#454A52; --mu:#8D939C; --line:#E4E7EB; --tile:#EEF0F3; --bg:#F4F5F7; --card:#FFFFFF;
  --green:#2F6BFF; --green-h:#1F57E6;
  --font:"Geist","ABC Diatype",Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block}
.muted{color:var(--mu)}

/* views */
body[data-view="room"],body[data-view="quiz"]{overflow:hidden;height:100vh}
.page{display:none}
body[data-view="home"] #pg-home,body[data-view="shop"] #pg-shop{display:block}
#stage,.room-ui,.quiz-ui{display:none}
body[data-view="room"] #stage,body[data-view="quiz"] #stage{display:block}
body[data-view="room"] .room-ui{display:block}
body[data-view="quiz"] .quiz-ui{display:block}

/* header */
.hdr{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;padding:0 28px;background:rgba(244,245,247,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body[data-view="home"] .hdr,body[data-view="shop"] .hdr{box-shadow:0 1px 0 var(--line)}
body[data-view="room"] .hdr,body[data-view="quiz"] .hdr{position:fixed;left:0;right:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.logo{font-weight:600;font-size:21px;letter-spacing:-.045em;display:flex;align-items:center;gap:8px}
.logo i{width:18px;height:18px;border-radius:5px;background:var(--ink);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:2px;background:var(--bg)}
.nav{display:flex;gap:4px}
.nav a{padding:9px 15px;border-radius:999px;font-size:15px;color:var(--ink2);font-weight:500}
.nav a:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.nav a.on{color:var(--ink);background:rgba(0,0,0,.06)}
body[data-view="room"] .nav,body[data-view="quiz"] .nav{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.hr{justify-self:end;display:flex;gap:8px;align-items:center}
.btn{height:46px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#2A2A2A}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:var(--green-h)}
.btn.soft{background:rgba(0,0,0,.06);color:var(--ink)}.btn.soft:hover{background:rgba(0,0,0,.1)}
.btn.white{background:#fff;color:var(--ink)}.btn.white:hover{background:#FAF8F5}
.btn.lg{height:54px;padding:0 26px;font-size:16px}
.btn[disabled]{opacity:.35;pointer-events:none}
.cnt{min-width:22px;height:22px;border-radius:999px;background:var(--green);color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 6px;font-weight:600}

/* home */
.hero{max-width:1180px;margin:0 auto;padding:64px 28px 52px;text-align:center}
.stage-gap{height:calc(100svh - 72px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;box-sizing:border-box}
.cue{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px;padding:10px 18px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2);background:rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.cue:hover{background:rgba(255,255,255,.7)}
.cue i{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);animation:cue 1.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(4px) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.cue i{animation:none}}
.hero h1{font-size:clamp(46px,6.6vw,92px);line-height:.96;letter-spacing:-.06em;font-weight:500;margin:0 auto;max-width:980px}
.hero .sub{font-size:19px;color:var(--ink2);margin:24px auto 0;max-width:540px}
.choose{max-width:1180px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{text-align:left;border-radius:28px;background:var(--tile);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.choice:hover{transform:translateY(-4px)}
.choice .ch{padding:32px 32px 0;display:flex;flex-direction:column;gap:10px}
.choice .cv{height:320px;padding:24px 24px 20px;box-sizing:border-box;position:relative;display:grid;place-items:center;overflow:hidden}
.choice .ct{margin-top:auto;padding:0 32px 30px}
.choice h2{font-size:40px;font-weight:500;letter-spacing:-.045em;line-height:1}
.choice p{color:var(--ink2);font-size:16px;max-width:420px}
.choice .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.choice .row span.muted{font-size:15px}
.choice .row .btn{margin-left:auto}
.steps{display:flex;flex-direction:column;gap:10px;width:min(380px,82%)}
.steps span{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:500}
.steps span b{font-weight:500;color:var(--mu);width:16px}
.steps span:nth-child(2){transform:translateX(16px)}.steps span:nth-child(3){transform:translateX(32px)}.steps span:nth-child(4){transform:translateX(48px)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(360px,84%)}
.quad div{aspect-ratio:1.3;background:#fff;border-radius:16px;overflow:hidden}
.quad img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}.quad img.ok{opacity:1}
.sec{max-width:1180px;margin:0 auto;padding:110px 28px 20px}
.sech{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:20px}
.sech h3{font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.05em;line-height:1}
.sech p{color:var(--ink2);font-size:17px;margin-top:12px;max-width:520px}
.kits{display:grid;gap:16px}
.kit{display:grid;grid-template-columns:1.25fr 1fr;border-radius:28px;background:var(--card);overflow:hidden;min-height:400px}
.kit .kv{background:var(--tile);position:relative}
.kit .kv img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain;opacity:0;transition:opacity .5s}
.kit .kv img.ok{opacity:1}
.kit .kc{padding:34px 34px 30px;display:flex;flex-direction:column}
.kit .who{display:block;font-size:15px;color:var(--mu);margin-top:10px}
.kit h4{font-size:40px;font-weight:500;letter-spacing:-.05em;line-height:1;margin:0}
.kit .kd{color:var(--ink2);font-size:16px;margin-top:12px}
.kit ul{list-style:none;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.kit li{font-size:14px;background:var(--bg);border-radius:999px;padding:6px 12px;color:var(--ink2)}
.kit .kp{margin-top:auto;padding-top:26px;display:flex;align-items:baseline;gap:12px}
.kit .kp b{font-size:34px;font-weight:500;letter-spacing:-.04em}
.kit .kp s{color:var(--mu);font-size:17px}
.kit .kp em{font-style:normal;font-size:15px;color:var(--green);font-weight:500}
.kit .kb{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
footer{max-width:1180px;margin:90px auto 0;padding:36px 28px 50px;display:flex;justify-content:space-between;color:var(--mu);font-size:15px;border-top:1px solid var(--line)}

/* masonry tiles */
.mas{column-count:5;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:24px;position:relative;cursor:pointer}
.tile .ti{background:var(--tile);border-radius:20px;overflow:hidden;position:relative}
.tile .ti img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.tile .ti img.ok{opacity:1}
.tile:hover .ti img{transform:scale(1.04)}
.tile .ti.sq{aspect-ratio:1}.tile .ti.tall{aspect-ratio:3/4}.tile .ti.wide{aspect-ratio:4/3}
.tile .tm{display:flex;justify-content:space-between;gap:10px;padding:11px 4px 0;font-size:15px}
.tile .tm b{font-weight:500}.tile .tm span{color:var(--ink2);white-space:nowrap}
.tile .tm small{display:block;font-size:14px;color:var(--mu);margin-top:1px}
.tile .tadd{position:absolute;right:12px;top:12px;height:38px;padding:0 16px;border-radius:999px;background:var(--green);color:#fff;font-weight:500;font-size:14px;opacity:0;transform:translateY(-4px);transition:.2s}
.tile:hover .tadd,.tile.in .tadd{opacity:1;transform:none}
.tile.in .tadd{background:#fff;color:var(--green)}
@media (hover:none){.tile .tadd{opacity:1;transform:none}}

/* shop */
.shophd{max-width:1440px;margin:0 auto;padding:56px 28px 0;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.shophd h1{font-size:clamp(48px,6vw,84px);font-weight:500;letter-spacing:-.06em;line-height:.95}
.shophd p{color:var(--ink2);margin-top:12px;font-size:17px}
.filters{max-width:1440px;margin:0 auto;padding:28px 28px 22px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:72px;z-index:5;background:rgba(244,245,247,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.filters button{height:42px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:500;background:rgba(0,0,0,.05);color:var(--ink2)}
.filters button.on{background:var(--ink);color:#fff}
.filters button small{font-size:14px;margin-left:6px;opacity:.55}
#shopGrid{max-width:1440px;margin:0 auto;padding:0 28px 40px}

/* 3D stage */
#stage{position:fixed;inset:0;z-index:0;transition:opacity .4s}
#stage.fade{opacity:0}
#stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab;touch-action:none}
#stage canvas:active{cursor:grabbing}

/* room UI */
.rtabs{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:2px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.rtabs button{height:42px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink2);white-space:nowrap}
.rtabs button:hover{background:rgba(0,0,0,.05)}
.rtabs button.on{background:var(--ink);color:#fff}
.rtabs button small{font-size:13px;margin-left:6px;opacity:.6}
.setup{position:fixed;left:28px;top:90px;z-index:10;font-size:15px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.setup b{font-weight:500;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.setup button{align-self:flex-start;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;margin-top:6px}
.tray{position:fixed;left:20px;right:20px;bottom:20px;z-index:8;background:#fff;border-radius:26px;box-shadow:0 0 0 1px var(--line),0 24px 60px -30px rgba(40,50,70,.28);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.tray.hide{transform:translateY(calc(100% - 64px))}
.trayhd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px 0 24px;height:58px}
.trayhd h2{font-size:20px;font-weight:500;letter-spacing:-.035em;display:flex;align-items:baseline;gap:12px}
.trayhd h2 small{font-size:15px;color:var(--mu);font-weight:400;letter-spacing:-.01em}
.trayhd .r{display:flex;align-items:center;gap:14px}
.trayhd .sum{font-size:15px;color:var(--mu)}
.trayhd .sum b{font-weight:500;font-size:17px;color:var(--ink);margin-left:6px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.05)}
.ib:hover{background:rgba(0,0,0,.09)}
.ib svg{width:18px;height:18px;transition:transform .3s}
.tray.hide .ib.tog svg{transform:rotate(180deg)}
.cards{display:flex;gap:12px;overflow-x:auto;padding:12px 24px 20px;scrollbar-width:thin;scrollbar-color:#ddd transparent}
.card{flex:none;width:220px;cursor:pointer;position:relative;text-align:left}
.card .ci{height:150px;border-radius:18px;background:var(--tile);overflow:hidden;position:relative}
.card .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s,transform .4s}
.card .ci img.ok{opacity:1}
.card:hover .ci img{transform:scale(1.05)}
.card.in .ci{box-shadow:inset 0 0 0 2px var(--green)}
.card .cm{padding:10px 2px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .cm b{font-weight:500;font-size:15px;line-height:1.25;display:block}
.card .cm .p{font-size:15px;color:var(--ink2);white-space:nowrap}
.card .add{position:absolute;right:10px;top:10px;height:36px;padding:0 14px;border-radius:999px;background:var(--green);color:#fff;font-size:14px;font-weight:500}
.card.in .add{background:#fff;color:var(--green)}
.card.prov{cursor:default}.card.prov .add{display:none}
.card .pv{position:absolute;left:10px;top:10px;font-size:13px;background:#fff;border-radius:999px;padding:5px 10px;color:var(--ink2)}
.card.flash .ci{animation:cfl 1s ease}
@keyframes cfl{40%{box-shadow:inset 0 0 0 4px var(--green)}}
.pop{position:fixed;z-index:9;transform:translate(-50%,calc(-100% - 12px));background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line),0 16px 40px -18px rgba(0,0,0,.3);display:none;min-width:210px}
.pop.show{display:block;animation:pin .2s ease}
@keyframes pin{from{opacity:0;transform:translate(-50%,calc(-100% - 4px))}}
.pop b{display:block;font-weight:500;font-size:16px;margin-bottom:10px}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.pop .btn{height:36px;padding:0 14px;font-size:14px}

/* quiz UI */
.qpanel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(860px,calc(100vw - 40px));z-index:10;background:#fff;border-radius:28px;padding:24px 28px 22px;box-shadow:0 0 0 1px var(--line),0 30px 70px -30px rgba(40,50,70,.3)}
.qpanel.anim{animation:qin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translate(-50%,12px)}}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qprog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mu)}
.qprog i{width:28px;height:4px;border-radius:4px;background:#ECE7E0}.qprog i.on{background:var(--ink)}
.qprog span{margin-left:8px}
.qtop .links{display:flex;gap:6px}
.qtop .links button{height:34px;padding:0 12px;border-radius:999px;font-size:14px;color:var(--ink2);font-weight:500}
.qtop .links button:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.qpanel h2{font-size:clamp(28px,3.4vw,40px);font-weight:500;letter-spacing:-.05em;line-height:1.02}
.qpanel .qs{color:var(--mu);font-size:16px;margin-top:6px}
.qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.qopt{text-align:left;border-radius:18px;background:var(--bg);padding:18px 18px;display:flex;flex-direction:column;gap:2px;transition:background .15s,box-shadow .15s}
.qopt:hover{background:#EEE9E2}
.qopt.on{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.qopt b{font-size:18px;font-weight:500;letter-spacing:-.025em}
.qopt small{color:var(--mu);font-size:14px}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px;color:var(--mu);gap:12px}
.qfoot button{font-size:15px;font-weight:500;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.qfoot button:hover{color:var(--ink)}
.qbusy{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500;padding:16px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #E5E0D9;border-top-color:var(--ink);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,25,35,.18);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#fff;z-index:31;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.dhd{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 8px}
.dhd h2{font-size:30px;font-weight:500;letter-spacing:-.05em}
.dbody{flex:1;overflow-y:auto;padding:4px 24px 10px}
.dgrp{margin-top:18px}.dgrp h4{font-size:14px;font-weight:500;color:var(--mu);margin-bottom:4px}
.dl{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.dl .im{width:62px;height:50px;border-radius:12px;background:var(--tile);flex:none;overflow:hidden}.dl .im img{width:100%;height:100%;object-fit:contain}
.dl .t{flex:1;min-width:0}.dl .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .p{font-size:15px}
.dl .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}.dl .x:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.dempty{color:var(--mu);padding:28px 0;font-size:16px}
.dft{padding:18px 24px 24px;border-top:1px solid var(--line)}
.dft .tl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.dft .tl span{font-size:15px;color:var(--mu)}
.dft .tl b{font-size:30px;font-weight:500;letter-spacing:-.04em}
.dft .btn{width:100%}
.done{text-align:center;padding:50px 10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:28px}
.done h3{font-size:28px;font-weight:500;letter-spacing:-.04em}.done p{color:var(--ink2);margin-top:6px}
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);z-index:40;background:var(--ink);color:#fff;font-size:15px;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---- Apple-style glass over the 3D room ---- */
.glass,body[data-view="room"] .nav,body[data-view="quiz"] .nav,.rtabs,.tray,.zoom{
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02))!important;
  backdrop-filter:blur(2.5px) saturate(1.5);-webkit-backdrop-filter:blur(2.5px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.38),0 12px 40px -18px rgba(40,50,70,.22)!important}
body[data-view="room"] .nav a.on,body[data-view="quiz"] .nav a.on{background:rgba(255,255,255,.7)}
body[data-view="room"] .nav a:hover,body[data-view="quiz"] .nav a:hover,.rtabs button:hover{background:rgba(255,255,255,.45)}
.rtabs button.on{background:rgba(18,18,18,.82)}
.tray .cards{scrollbar-color:rgba(0,0,0,.18) transparent}
.tray .card .ci{box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 18px -10px rgba(40,50,70,.25)}
.tray .card.in .ci{box-shadow:inset 0 0 0 2px var(--green),0 6px 18px -10px rgba(40,50,70,.25)}
.tray .ib{background:rgba(255,255,255,.5)}.tray .ib:hover{background:rgba(255,255,255,.8)}
body[data-view="room"] #cartBtn{background:rgba(18,18,18,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.zoom{position:fixed;right:28px;top:50%;transform:translateY(-70%);z-index:10;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:999px}
.zoom button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

.bubble.right{transform:translate(22px,-50%)}.bubble.right:after{left:-7px;top:50%;bottom:auto;transform:translateY(-50%) rotate(45deg)}

  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(Object.values(ITEMS).filter(g=>g.visible&&g.scale.x>.5),true)[0];hit&&hit.object.userData.key?showPop(hit.object.userData.key):hidePop();});
function switchRoom(r){if(r===S.room)return;S.room=r;save();hidePop();stage.classList.add('fade');setTimeout(()=>{buildRoom();renderRoomUI();requestAnimationFrame(()=>stage.classList.remove('fade'));},380);}

/* ================= QUIZ — 4 questions; the person walks to their building, then through the room ================= */
const QZ=[
  {id:'home',t:'Where are you moving?',s:'Pick your building — you’ll walk right in.',o:Object.entries(HOMES).map(([k,v])=>[k,v.n,v.d])},
  {id:'size',t:'How big is your room?',s:'Rough is fine. The room resizes to match.',o:Object.entries(SIZES).map(([k,v])=>[k,v.n,v.d])},
  {id:'furn',t:'What comes with it?',s:'We won’t sell you what’s already there.',o:Object.entries(FURN).map(([k,v])=>[k,v.n,v.d])},
  {id:'bed',t:'What size is the bed?',s:'So your frame and bedding fit.',o:Object.entries(BEDS).map(([k,v])=>[k,v.n,v.d])}
];
let QI=0,QBUSY=false,QDONE={};
function spot(i){const {W,D}=dims();if(i===1)return[-4+W*.56,-3+D*.6];if(i===2)return[mapX(1.6),mapZ(-1.2)];return[mapX(.15),mapZ(-.7)];}
const QICON={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg>',
 size:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16l12-12 4 4-12 12zM8 12l2 2M11 9l2 2M14 6l2 2"/></svg>',
 furn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3zM6 18v2M18 18v2"/></svg>',
 bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 18V6M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6M7 11.5a1.5 1.5 0 1 0 0-.01"/></svg>'};
const QLABEL={home:'Type of place',size:'Room size',furn:'What’s provided',bed:'Bed size'};
function ansText(id){if(!QDONE[id])return null;if(id==='home')return HOMES[S.home].n;if(id==='size')return SIZES[S.size].n+' · '+SIZES[S.size].d;if(id==='furn')return FURN[furnKey()].n;if(id==='bed')return BEDS[S.bed].n;}
function renderQuizChrome(busy){if(!$('qside'))return;const q=QZ[QI];const cur=q.id==='furn'?furnKey():S[q.id];
  $('qside').innerHTML=`<div class="sh"><button class="ib" data-go="home" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><div><b>Quiz</b><small>Set up your place</small></div></div>
  <div class="sl"><span>Questions</span><span>${Object.keys(QDONE).length} / ${QZ.length}</span></div>
  ${QZ.map((z,i)=>{const st=busy||QDONE[z.id]&&i!==QI?'done':i===QI?'cur':'pend';const a=ansText(z.id);return `<button class="qs-step ${st}" ${st==='done'&&!busy?`data-qgo="${i}"`:''}><span class="ic">${QICON[z.id]}</span><span><b>${QLABEL[z.id]}</b><small>${a||(i===QI&&!busy?'Waiting for you':'Not answered')}</small></span><span class="st">${st==='done'?'✓':''}</span></button>`}).join('')}
  <div class="grow"></div><div class="place"><b>Skip it all?</b>Head straight to the shop and add pieces yourself.<br><button data-qexit>Go to shop →</button></div>`;
  const steps=[['Walk to your building','Pick a place to move into',0],['Size the room','Walls and floor match your answer',1],['Bring in what’s provided','We leave those out of your kit',2],['Fit the bed','Frame and bedding sized to match',3],['Build your starter kit','Pieces that fit your room',4]];
  $('qinsp').innerHTML=busy?`<div class="qi-h"><span>Almost done</span></div><div class="qi-q">Picking the pieces that fit your room…</div>`+tlHTML(steps,4,true):
   `<div class="qi-h"><span>Question ${QI+1} of ${QZ.length}</span>${QI?'<button data-qback style="color:var(--ink2)">← Back</button>':''}</div><div class="qi-q">${q.t}</div><div class="qi-s">${q.s}</div>
   ${q.o.map(([v,b,sm],i)=>`<button class="qi-o ${QDONE[q.id]&&cur===v?'on':''}" data-v="${v}" data-qopt="1"><span class="k">${'ABC'[i]}</span><span><b>${b}</b><small>${sm}</small></span></button>`).join('')}
   <button class="qi-sk" data-qskip>Skip this question →</button>`+tlHTML(steps,QI,false);
  $('qbar').innerHTML=`<span class="prog">${QZ.map((_,i)=>`<i class="${i<=QI?'on':''}"></i>`).join('')}</span><span>${busy?'Building your room':`Question ${QI+1} of ${QZ.length}`}</span>${busy?'':`<button data-qskip>Skip question</button><button class="dark" data-qexit>Skip to shop</button>`}`;
  $('bubble').innerHTML=busy?`<div class="ph"><span class="tag">ALMOST DONE</span><span>You</span></div><p>Picking the pieces that fit…</p>`:`<div class="ph"><span class="tag">NEEDS YOU</span><span>Question ${QI+1} of ${QZ.length}</span></div><p>${q.t}</p><div class="bb">${q.o.map(([v,b])=>`<button class="${QDONE[q.id]&&cur===v?'on':''}" data-v="${v}" data-qopt="1">${b}</button>`).join('')}</div>`;
  $('bubble').classList.add('show');}
function tlHTML(steps,at,busy){return `<div class="qi-t"><h5>What happens</h5>${steps.map(([b,sm,i])=>{const st=i<at?'ok':i===at?'cur':'';return `<div class="tl ${st}"><i>${st==='ok'?'✓':''}</i><b>${b}</b><small>${sm}</small>${busy&&i===at?'<span class="pb"><i></i></span>':''}</div>`}).join('')}</div>`;}
function placeBubble(){if(VIEW!=='quiz'||!P||innerWidth<760)return;const town=MODE==='town';const v=P.position.clone().add(new THREE.Vector3(town?.25:0,town?1.1:2.0,0)).project(cam);const b=$('bubble');b.classList.toggle('right',town);b.style.visibility=(town&&innerWidth<1100)?'hidden':'';b.style.left=((v.x+1)/2*innerWidth)+'px';b.style.top=((1-v.y)/2*innerHeight)+'px';}
function renderQ(anim=true){renderQuizChrome(false);const q=QZ[QI];const cur=q.id==='furn'?furnKey():S[q.id];
  $('qpanel').innerHTML=`<div class="qtop"><div class="qprog">${QZ.map((_,i)=>`<i class="${i<=QI?'on':''}"></i>`).join('')}<span>${QI+1} / ${QZ.length}</span></div><div class="links">${QI?'<button data-qback>← Back</button>':''}<button data-qexit>Skip to shop</button></div></div>
  <h2>${q.t}</h2><p class="qs">${q.s}</p>
  <div class="qopts">${q.o.map(([v,b,s],i)=>`<button class="qopt ${QDONE[q.id]&&cur===v?'on':''}" data-v="${v}"><b>${b}</b><small>${s}</small></button>`).join('')}</div>
  <div class="qfoot"><span>Not sure? Skip it — you can change this later.</span><button data-qskip>Skip question →</button></div>`;
  if(anim){$('qpanel').classList.remove('anim');void $('qpanel').offsetWidth;$('qpanel').classList.add('anim');}}
function enterRoomFromTown(){stage.classList.add('fade');setTimeout(()=>{S.room='bedroom';const {W,D}=dims();buildRoom({quiz:true,person:[-4+W*.7,-3+D-.35]});stage.classList.remove('fade');QI=1;QBUSY=false;renderQ();requestAnimationFrame(()=>frame());const s=spot(1);walkTo(s[0],s[1],1000);},420);}
function startQuiz(){QI=0;QBUSY=false;QDONE={};renderQ();buildTown();requestAnimationFrame(()=>frame());}
function answer(v){if(QBUSY)return;const q=QZ[QI];QBUSY=true;QDONE[q.id]=true;S[q.id]=v;save();renderQ(false);$('bubble').classList.remove('show');
  if(q.id==='home'){highlightBuilding(v);walkTo(BX[v],2.2,1500,enterRoomFromTown);return;}
  const here=P?[P.position.x,P.position.z]:spot(QI);
  if(q.id==='size'){const {W,D}=dims();buildRoom({quiz:true,keepCam:true,person:[Math.min(here[0],-4+W-.7),Math.min(here[1],-3+D-.7)]});setTimeout(next,1100);return;}
  if(q.id==='furn'){buildRoom({quiz:true,person:here});FURN[v].set.forEach(k=>{if(ITEMS[k]){setPivot(ITEMS[k],.001);animItem(k,true);}});const s=spot(2);walkTo(s[0],s[1],900,()=>setTimeout(next,250));return;}
  if(q.id==='bed'){buildRoom({quiz:true,person:here,show:new Set(['bed','bedding'])});const s=spot(3);walkTo(s[0],s[1],800,()=>setTimeout(next,300));return;}}
function skipQ(){if(QBUSY)return;if(QZ[QI].id==='home'){QBUSY=true;highlightBuilding(S.home);walkTo(BX[S.home],2.2,1300,enterRoomFromTown);return;}next();}
function next(){QBUSY=false;if(QI<QZ.length-1){QI++;renderQ();if(QZ[QI].id==='bed'){const here=P?[P.position.x,P.position.z]:spot(3);buildRoom({quiz:true,person:here,show:new Set(['bed','bedding'])});}else frame(false);}else finishQuiz();}
function back(){if(QBUSY||!QI)return;QI--;renderQ();if(QI===0){buildTown();}else{const here=P?[P.position.x,P.position.z]:spot(QI);buildRoom({quiz:true,person:here,show:QZ[QI].id==='bed'?new Set(['bed','bedding']):undefined});}}
function finishQuiz(){QBUSY=true;renderQuizChrome(true);$('qpanel').innerHTML='<div class="qbusy"><span class="spin"></span>Picking the pieces that fit your room…</div>';
  const pool=PRI.slice(0,TIER[S.size]).filter(k=>I[k]&&avail(k)&&!provided(k)&&homeRooms().includes(I[k].room));
  S.added=new Set([...S.added].filter(k=>!homeRooms().includes(I[k].room)));pool.forEach(k=>S.added.add(k));S.room=homeRooms()[0];save();updateCount();
  setTimeout(()=>{QBUSY=false;go('room');toast(`Your starter kit · ${pool.length} pieces · ${money(pool.reduce((s,k)=>s+price(k),0))}`);},900);}

/* ================= CART ================= */
let ordered=false;
function kitSavings(ks){let sv=0;(S.kits||new Set()).forEach(id=>{const kit=KITS.find(x=>x.id===id);if(kit&&kit.items.every(i=>ks.includes(i))){const [f,p]=kitPrice(kit);sv+=f-p;}});return sv;}
function renderCart(){const d=$('drawer');const ks=inCart();const save_=kitSavings(ks);const tot=ks.reduce((s,k)=>s+price(k),0)-save_;
  if(ordered){d.innerHTML=`<div class="dhd"><h2>Order placed</h2><button class="ib" data-close aria-label="Close">✕</button></div><div class="dbody"><div class="done"><div class="ok">✓</div><h3>You’re all set.</h3><p>${ks.length} pieces · ${money(tot)}</p><p class="muted" style="margin-top:16px">Demo checkout — no payment taken.</p></div></div><div class="dft"><button class="btn soft lg" data-close>Back</button></div>`;return;}
  const groups=['bedroom','living','kitchen','bathroom'].map(r=>[r,ks.filter(k=>I[k].room===r)]).filter(([,a])=>a.length);
  d.innerHTML=`<div class="dhd"><h2>Cart</h2><button class="ib" data-close aria-label="Close">✕</button></div>
  <div class="dbody">${groups.length?groups.map(([r,a])=>`<div class="dgrp"><h4>${ROOMNAME[r]}</h4>${a.map(k=>`<div class="dl"><div class="im">${imgTag(k)}</div><div class="t"><b>${nameOf(k)}</b></div><span class="p">${money(price(k))}</span><button class="x" data-del="${k}" aria-label="Remove">✕</button></div>`).join('')}</div>`).join(''):'<p class="dempty">Nothing here yet. Add pieces from the shop, or take the quiz and we’ll build a starter kit.</p>'}</div>
  <div class="dft">${save_?`<div class="tl" style="margin-bottom:6px"><span>Kit savings</span><span style="color:var(--green);font-weight:500">−${money(save_)}</span></div>`:''}<div class="tl"><span>Total, ${ks.length} items</span><b>${money(tot)}</b></div><button class="btn green lg" id="checkout" ${ks.length?'':'disabled'}>Checkout</button></div>`;}
function openCart(o){$('drawer').classList.toggle('show',o);$('scrim').classList.toggle('show',o);if(o){ordered=false;renderCart();}}


/* ================= CHECKOUT (delivery → payment → review → done) ================= */
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MONN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SLOTS=['8 – 11 am','11 am – 2 pm','2 – 5 pm','5 – 8 pm'];

const PROMOS={SETTLY10:.1,STUDENT10:.1,MOVEIN15:.15};
const coDays=()=>{const out=[],t=new Date();for(let i=1;i<=14;i++){const d=new Date(t);d.setDate(t.getDate()+i);out.push(d);}return out;};

let CO=null;
function coTotals(){const ks=CO&&CO.done&&CO.bought?CO.bought:inCart(),sub=ks.reduce((t,k)=>t+price(k),0),kit=kitSavings(ks),disc=CO&&CO.promo?(sub-kit)*PROMOS[CO.promo]:0,m=METH.find(x=>x[0]===CO.d.method);
  const ship=m[0]==='door'?(sub-kit>=200?0:19):m[3];const tax=(sub-kit-disc)*.07;return {ks,sub,kit,disc,ship,tax,tot:sub-kit-disc+ship+tax};}

const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function fld(id,lbl,v,ph,a=''){return `<label class="fld ${CO.err[id]?'bad':''}"><span>${lbl}</span><input id="f_${id}" data-cf="${id}" value="${esc(v)}" placeholder="${ph}" ${a} autocomplete="off">${CO.err[id]?`<em>${CO.err[id]}</em>`:''}</label>`;}

  ${CO.done?'':`<div class="promo"><input id="promoIn" placeholder="Promo code" value="${esc(CO.promo)}"><button class="btn soft" id="promoBtn">Apply</button></div>${CO.promo?`<div class="promo-ok">${CO.promo} applied · ${PROMOS[CO.promo]*100}% off</div>`:`<div class="hint" style="font-size:12.5px;color:var(--mu)">Try STUDENT10</div>`}`}

  <div class="ln"><span>Delivery</span><span>${T.ship?money(T.ship):'Free'}</span></div><div class="ln"><span>Estimated tax</span><span>${money(T.tax)}</span></div>
  <div class="ln tot"><span>Total</span><b>${money(T.tot)}</b></div></div>

function coSteps(){return `<div class="cost">${['Delivery','Payment','Review'].map((l,i)=>`<button class="${CO.step===i+1?'on':''} ${CO.step>i+1?'ok':''}" data-st="${i+1}" ${i+1>CO.step?'disabled':''}><i>${CO.step>i+1?'✓':i+1}</i>${l}</button>`).join('')}</div>`;}

   <div class="cobox"><h4>Delivery day</h4><p class="hint">Pick your move-in day — everything arrives together.</p>

   <div class="cobox"><h4>How should it get to you?</h4><div class="meths">${METH.map(([id,t,sm,f])=>`<button class="meth ${d.method===id?'on':''}" data-meth="${id}"><i></i><span><b>${t}</b><small>${sm}</small></span><em>${id==='door'?(T.sub-T.kit>=200?'Free':'$19'):f?'$'+f:'Free'}</em></button>`).join('')}</div>

     <div class="frow">${fld('exp','Expiry',p.exp,'MM/YY','maxlength="5"')}${fld('cvc','CVC',p.cvc,'123','inputmode="numeric" maxlength="4"')}</div>
     <div class="frow">${fld('nm','Name on card',p.nm,'Alex Kim')}</div>

  $('pg-co').innerHTML=`<div class="co"><div class="co-top"><div><button class="co-back" data-go="room">← Back to my room</button><h1>Checkout</h1></div>${coSteps()}</div><div>${body}</div>${coSum(T)}</div>`;
  T.ks.forEach(k=>queueThumb(k));}
function renderDone(T){const d=CO.d,dd=coDays()[d.date],m=METH.find(x=>x[0]===d.method);const dl=x=>dLbl(new Date(dd.getTime()-x*864e5));
  const steps=[['Order placed','Today',0],['Packed at the Settly hub',dl(2),1],[m[0]==='pick'?'Ready for pick-up':'Out for delivery',dl(0)+' · '+SLOTS[d.slot],2],[m[0]==='room'?'Built in your room':'Delivered',dl(0),3]];
  $('pg-co').innerHTML=`<div class="co"><div class="codone"><div class="dhero"><div class="ball">✓</div><p class="no">Order ${CO.done}</p><h2>You’re all set, ${esc((d.name||'friend').split(' ')[0])}!</h2>
   <p>Your ${T.ks.length} pieces arrive on <b>${dLbl(dd)}</b>, ${SLOTS[d.slot]}. We sent a confirmation to ${esc(d.email)||'your email'}.</p>
   <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap"><button class="btn dark lg" data-go="room">See my room</button><button class="btn soft lg" data-go="shop">Keep shopping</button></div>
   <p class="proto" style="max-width:none">Prototype · no real payment was made.</p></div>
   <div class="rc2"><div class="cobox track"><h4>Tracking</h4><div style="margin-top:16px">${steps.map(([b,sm,i])=>`<div class="tl ${i===0?'ok':i===1?'cur':''}"><i>${i===0?'✓':''}</i><b>${b}</b><small>${sm}</small></div>`).join('')}</div></div>${coSum(T)}</div></div></div>`;}
function coRead(){document.querySelectorAll('#pg-co input[data-cf]').forEach(i=>{const k=i.dataset.cf;if(k in CO.d)CO.d[k]=i.value.trim();else if(k in CO.p)CO.p[k]=i.value.trim();});
  const pk=$('f_pack');if(pk)CO.d.pack=pk.checked;const sm=$('f_same');if(sm)CO.p.same=sm.checked;}
function coValidate(){const e={},d=CO.d,p=CO.p;
  if(CO.step===1){if(!d.name)e.name='Add your name';if(!/^\S+@\S+\.\S+$/.test(d.email))e.email='Check your email';if(!d.street)e.street='Add a street address';if(!d.city)e.city='Add a city';if(!/^[A-Za-z]{2}$/.test(d.st))e.st='2 letters';if(!/^\d{5}$/.test(d.zip))e.zip='5 digits';}
  if(CO.step===2&&p.m==='card'){if(p.num.replace(/\D/g,'').length<15)e.num='Check the card number';if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(p.exp))e.exp='Use MM/YY';if(!/^\d{3,4}$/.test(p.cvc))e.cvc='3–4 digits';if(!p.nm)e.nm='Add the name on the card';}
  CO.err=e;return !Object.keys(e).length;}
document.addEventListener('input',e=>{const t=e.target;if(!t.closest||!t.closest('#pg-co'))return;
  if(t.id==='f_num'){const v=t.value.replace(/\D/g,'').slice(0,16);t.value=v.replace(/(.{4})/g,'$1 ').trim();}
  if(t.id==='f_exp'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v;}
  if(t.id==='f_cvc'||t.id==='f_zip')t.value=t.value.replace(/\D/g,'');
  if(t.id==='f_st')t.value=t.value.replace(/[^a-z]/gi,'').toUpperCase();
  if(CO&&CO.step===2&&['f_num','f_exp','f_nm'].includes(t.id)){coRead();const nm=CO.p.num.replace(/\D/g,'');const v=document.querySelector('.cardviz');if(v){v.querySelector('.num').textContent=(nm.padEnd(16,'•').match(/.{1,4}/g)||[]).join(' ');v.querySelectorAll('.row span')[0].textContent=CO.p.nm||'NAME ON CARD';v.querySelectorAll('.row span')[1].textContent=CO.p.exp||'MM/YY';}}});
document.addEventListener('click',e=>{if(VIEW!=='checkout'||!CO)return;const t=e.target;
  const st=t.closest('[data-st]');if(st&&!st.disabled){coRead();CO.step=+st.dataset.st;CO.err={};renderCO();window.scrollTo(0,0);return;}
  const dy=t.closest('[data-day]');if(dy){coRead();CO.d.date=+dy.dataset.day;renderCO();return;}
  const sl=t.closest('[data-slot]');if(sl){coRead();CO.d.slot=+sl.dataset.slot;renderCO();return;}
  const me=t.closest('[data-meth]');if(me){coRead();CO.d.method=me.dataset.meth;renderCO();return;}
  const pm=t.closest('[data-pm]');if(pm){coRead();CO.p.m=pm.dataset.pm;CO.err={};renderCO();return;}
  if(t.closest('#testInfo')){Object.assign(CO.d,{name:'Alex Kim',email:'alex.kim@school.edu',street:'560 W 113th St',unit:'Hall B, Rm 214',city:'New York',st:'NY',zip:'10025'});CO.err={};renderCO();return;}
  if(t.closest('#testCard')){Object.assign(CO.p,{num:'4242 4242 4242 4242',exp:'12/28',cvc:'123',nm:CO.d.name||'Alex Kim'});CO.err={};renderCO();return;}
  if(t.closest('#promoBtn')){coRead();const c=($('promoIn').value||'').trim().toUpperCase();if(PROMOS[c]){CO.promo=c;toast(`${c} applied`);}else if(c){toast('That code isn’t valid');}renderCO();return;}
  if(t.closest('#coNext')){coRead();if(!coValidate()){renderCO();const b=document.querySelector('.fld.bad input');b&&b.focus();return;}
    if(CO.step<3){CO.step++;renderCO();window.scrollTo(0,0);return;}
    CO.bought=inCart();CO.done='#ST-'+Math.floor(100000+Math.random()*900000);CO.bought.forEach(k=>S.paid.add(k));S.kits.clear();save();updateCount();CO.p.num=CO.p.num.replace(/\D/g,'').slice(-4);CO.p.cvc='';renderCO();window.scrollTo(0,0);return;}});

/* ================= ROUTER ================= */
let VIEW='';
function go(v,fromHash){if(!['home','shop','room','quiz','checkout'].includes(v))v='home';if(v==='checkout'&&(!CO||!inCart().length))v=inCart().length?(CO={step:1,done:null,promo:'',err:{},d:{name:'',email:'',street:'',unit:'',city:'',st:'',zip:'',date:2,slot:1,method:'door',pack:true},p:{m:'card',num:'',exp:'',cvc:'',nm:'',same:true}},'checkout'):'shop';VIEW=v;document.body.dataset.view=v;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===v));
  if(!fromHash&&location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){}}
  hidePop();
  if(v==='home'){renderHome();const SHOW=['sofa','coffee','rug','floorlamp','plant','shelf','wallart','armchair','sidetable','throw'];buildRoom({room:'living',items:SHOW,show:new Set(SHOW),quiz:true});HOMET=performance.now();}
  if(v==='shop')renderShop();
  if(v==='room'){if(!homeRooms().includes(S.room))S.room=homeRooms()[0];renderRoomUI();buildRoom();requestAnimationFrame(()=>frame());}
  if(v==='quiz')startQuiz();
  if(v==='checkout')renderCO();
  needs=6;window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0));}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==VIEW)go(v,true);});

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();openCart(false);go(g.dataset.go);return;}
  const ak=e.target.closest('[data-addkit]');if(ak){const kit=KITS.find(x=>x.id===ak.dataset.addkit);kit.items.forEach(i=>S.added.add(i));S.kits.add(kit.id);save();updateCount();refreshTiles();toast(`${kit.n} added · ${kit.items.length} pieces`);return;}
  const vk=e.target.closest('[data-viewkit]');if(vk){const kit=KITS.find(x=>x.id===vk.dataset.viewkit);S.home=kit.home;S.furn=null;kit.items.forEach(i=>S.added.add(i));S.kits.add(kit.id);S.room=homeRooms()[0];save();updateCount();go('room');return;}
  const t=e.target.closest('.tile');if(t){toggle(t.dataset.k);return;}
  const f=e.target.closest('[data-f]');if(f){S.filter=f.dataset.f;renderShop();return;}
  const ins=e.target.closest('[data-insp]');if(ins){S.insp=ins.dataset.insp;renderPanels();return;}
  if(e.target.closest('#inspCheckout')){openCheckout();return;}
  const pk=e.target.closest('[data-pick]');if(pk&&!e.target.closest('[data-del]')){const k=pk.dataset.pick;if(I[k].room!==S.room){switchRoom(I[k].room);setTimeout(()=>showPop(k),900);}else showPop(k);return;}
  const zb=e.target.closest('[data-zoom]');if(zb){const z=zb.dataset.zoom;if(z==='fit'){frame(true);}else zoomBy(z==='in'?.78:1.28);return;}
  const r=e.target.closest('[data-r]');if(r){switchRoom(r.dataset.r);return;}
  const c=e.target.closest('.card');if(c){toggle(c.dataset.k);return;}
  const rm=e.target.closest('[data-rm]');if(rm){toggle(rm.dataset.rm);return;}
  if(e.target.closest('[data-close]'))return openCart(false);
  const dl=e.target.closest('[data-del]');if(dl){S.added.delete(dl.dataset.del);save();updateCount();renderCart();if(VIEW==='room'){buildRoom();renderRoomUI();}else refreshTiles();return;}
  if(e.target.closest('#checkout')){openCheckout();return;}
  const o=e.target.closest('.qopt,[data-qopt]');if(o){answer(o.dataset.v);return;}
  const qg=e.target.closest('[data-qgo]');if(qg){if(QBUSY)return;const t=+qg.dataset.qgo;while(QI>t)back();return;}
  if(e.target.closest('[data-qskip]'))return skipQ();
  if(e.target.closest('[data-qexit]'))return go('shop');
  if(e.target.closest('[data-qback]'))return back();
});
$('cartBtn').addEventListener('click',()=>openCart(true));
$('scrim').addEventListener('click',()=>openCart(false));
$('trayTog').addEventListener('click',()=>{$('tray').classList.toggle('hide');setTimeout(()=>frame(false),460);});
addEventListener('keydown',e=>{if(e.key==='Escape'){openCart(false);hidePop();}
  if(VIEW==='quiz'&&!QBUSY){const i='abc'.indexOf(e.key.toLowerCase());if(i>=0&&QZ[QI].o[i])answer(QZ[QI].o[i][0]);}});
addEventListener('resize',()=>{if(VIEW==='room'||VIEW==='quiz'||VIEW==='home')frame(false);placePop();});
new ResizeObserver(()=>{if(VIEW==='room')frame(false);}).observe($('tray'));
new ResizeObserver(()=>{if(VIEW==='quiz')frame(false);}).observe($('qpanel'));

/* ================= BOOT ================= */
updateCount();
go((location.hash||'#home').slice(1),true);
requestAnimationFrame(loop);
setTimeout(()=>KEYS.forEach(k=>queueThumb(k)),800);
window.__settly={S,go,toggle,answer,skipQ};
</script>
</body>
